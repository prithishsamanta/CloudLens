[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudlens"
version = "2.0.0"
description = "AI-powered CLI diagnostic tool for any AWS CloudWatch log group"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Prithish Samanta", email = "prithishsamanta@gmail.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "boto3",
    "python-dotenv",
    "rich",
    "fastapi",
    "uvicorn",
    "jinja2",
    "click",
]

[project.urls]
Homepage = "https://github.com/prithishsamanta/cloudlens"

[project.scripts]
cloudlens = "cloudlens.cli:main"

[tool.setuptools.packages.find]
include = ["cloudlens*"]

[tool.setuptools.package-data]
cloudlens = ["templates/*.html"]
